workflows:
  roam-ios-unsigned:
    name: Roam v0.20 - minimisable map controls (Release)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Check Roam source and build environment
        script: |
          set -eu
          test -f Locus.xcodeproj/project.pbxproj
          test -f Locus/Features/Settings/CellularResearchView.swift
          test -f Vendor/idevice/libidevice_ffi.a
          xcodebuild -version
          xcodebuild -list -project Locus.xcodeproj
      - name: Build iPhone Release app without code signing
        script: |
          set -o pipefail
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/roam-build.log"
      - name: Verify output version and app structure
        script: |
          set -eu
          APP="$CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos/Roam.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          echo "Built Roam $VERSION ($BUILD); expecting Roam 0.20.0 (20)"
          test "$VERSION" = "0.20.0"
          test "$BUILD" = "20"
          test -f "$APP/Roam"
      - name: Package unsigned IPA for signing in iLoader
        script: |
          set -eu
          APP="$CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos/Roam.app"
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/Payload/Roam.app"
          (cd "$CM_BUILD_DIR" && zip -qr roam-v0.20-unsigned.ipa Payload)
          test -f "$CM_BUILD_DIR/roam-v0.20-unsigned.ipa"
    artifacts:
      - roam-build.log
      - roam-v0.20-unsigned.ipa
      - DerivedData/Build/Products/Release-iphoneos/*.app
